[project]
name = "fmri-qa-core"
version = "0.1.0"
description = "Phantom fMRI quality-assurance calculation: metrics and analysis artifacts"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
# A per-package copy of the root LICENSE. A path reaching out of the package
# root (../../LICENSE) is not portable: hatchling drops it from the wheel
# entirely and writes an unusable `../../` member into the sdist. `make check`
# proves the copy is byte-identical to the root LICENSE.
license-files = ["LICENSE"]
authors = [
    { name = "Judd Storrs", email = "jstorrs@gmail.com" },
]
keywords = ["fMRI", "MRI", "phantom", "quality assurance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The calculation half deliberately depends on nothing that draws: no
# matplotlib, no ReportLab. Rendering lives in the fmri-qa-report distribution.
dependencies = [
    "nibabel>=5.3.2",
    "numpy>=2.3.4",
    "scikit-image>=0.25.2",
    "scipy>=1.16.2",
    # The artifact's container, and worth a ~10 MB wheel carrying libhdf5 and
    # libnetcdf. It is not one reader among several: it is *the* Unidata C
    # library, the same one MATLAB's `ncread`, R's `ncdf4`, `ncdump` and xarray
    # read through, so a file it writes is a file those were tested against.
    # Writing netCDF-4 by hand, or through a pure-Python encoder, would mean
    # claiming compatibility with a format whose only reference implementation
    # we had declined to link against.
    "netCDF4>=1.7",
    # The DICOM importer's converter, and a plain dependency rather than an
    # extra. It was an extra to spare the ~3 MB compiled binary to people who
    # only analyze NIfTI, which was the wrong trade: 3 MB is under a percent of
    # an installed environment, while an optional converter means `fmri-qa-import`
    # is the one command that can be installed and still not run -- and the way
    # it failed was a `uv sync` without `--all-extras` quietly removing it again.
    # A site with its own dcm2niix names it with `fmri-qa-import --dcm2niix`.
    "dcm2niix>=1.0.20250506",
]

[project.scripts]
fmri-qa = "fmriqc.cli:main"
fmri-qa-hilo = "fmriqc.cli:hilo_main"
fmri-qa-import = "fmriqc.cli:import_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmriqc"]

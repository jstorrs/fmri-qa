[project]
name = "fmri-qa-core"
version = "0.1.0"
description = "Phantom fMRI quality-assurance calculation: metrics and analysis artifacts"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["../../LICENSE"]
authors = [
    { name = "Judd Storrs", email = "jstorrs@gmail.com" },
]
keywords = ["fMRI", "MRI", "phantom", "quality assurance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The calculation half deliberately depends on nothing that draws: no
# matplotlib, no ReportLab. Rendering lives in the fmri-qa-report distribution.
dependencies = [
    "nibabel>=5.3.2",
    "numpy>=2.3.4",
    "scikit-image>=0.25.2",
    "scipy>=1.16.2",
]

[project.optional-dependencies]
notebooks = [
    "dcm2bids>=3.2.0",
    "dcm2niix>=1.0.20250506",
    "ipympl>=0.9.8",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.10",
    "nilearn>=0.12.1",
    "niwidgets>=0.2.1",
    "pydicom>=3.0.1",
    "scikit-fem>=12.0.2",
]

[project.scripts]
fmri-qa = "fmriqc.cli:main"
fmri-qa-hilo = "fmriqc.cli:hilo_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmriqc"]

[project]
name = "fmri-qa-core"
version = "0.1.0"
description = "Phantom fMRI quality-assurance calculation: metrics and analysis artifacts"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
# A per-package copy of the root LICENSE. A path outside the package
# (../../LICENSE) is not portable: hatchling drops it from the wheel and writes
# an unusable `../../` member into the sdist. `make check` verifies the copy is
# byte-identical to the root LICENSE.
license-files = ["LICENSE"]
authors = [
    { name = "Judd Storrs", email = "jstorrs@gmail.com" },
]
keywords = ["fMRI", "MRI", "phantom", "quality assurance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The calculation half depends on nothing that draws, including matplotlib.
# Rendering lives in fmri-qa-report.
dependencies = [
    "nibabel>=5.3.2",
    "numpy>=2.3.4",
    "scikit-image>=0.25.2",
    "scipy>=1.16.2",
    # The artifact's container. It is worth a ~10 MB wheel carrying libhdf5 and
    # libnetcdf: this is the Unidata C library that MATLAB's `ncread`, R's
    # `ncdf4`, `ncdump` and xarray read through, so a file it writes is a file
    # those were tested against. Writing netCDF-4 by hand or with a pure-Python
    # encoder would claim compatibility with a format whose only reference
    # implementation we declined to link.
    "netCDF4>=1.7",
    # The DICOM importer's converter. It is a plain dependency, not an extra.
    # As an extra it spared people who only analyze NIfTI a ~3 MB binary, which
    # is under a percent of an installed environment. It also made `fmri-qa-import`
    # the one command that could be installed and still not run, and a `uv sync`
    # without `--all-extras` quietly removed it. A site with its own dcm2niix
    # names it with `fmri-qa-import --dcm2niix`.
    "dcm2niix>=1.0.20250506",
]

[project.scripts]
fmri-qa = "fmriqa.cli:main"
fmri-qa-hilo = "fmriqa.cli:hilo_main"
fmri-qa-import = "fmriqa.cli:import_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmriqa"]

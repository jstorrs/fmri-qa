[project]
name = "fmri-qa-core"
version = "0.1.0"
description = "Phantom fMRI quality-assurance calculation: metrics and analysis files"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
# A per-package copy of the root LICENSE. A path outside the package
# (../../LICENSE) is not portable: hatchling drops it from the wheel and writes
# an unusable `../../` member into the sdist. `make check` verifies the copy is
# byte-identical to the root LICENSE.
license-files = ["LICENSE"]
authors = [
    { name = "Judd Storrs", email = "jstorrs@gmail.com" },
]
keywords = ["fMRI", "MRI", "phantom", "quality assurance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The calculation half depends on nothing that draws, including matplotlib.
# Rendering lives in fmri-qa-report.
dependencies = [
    "numpy>=2.3.4",
    "scikit-image>=0.25.2",
    "scipy>=1.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmriqa"]

[project]
name = "fmri-qa-io"
version = "0.1.0"
description = "File formats and filesystem IO for fmri-qa: scans, the .qa.nc artifact file, DICOM import"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
# A per-package copy of the root LICENSE. A path outside the package
# (../../LICENSE) is not portable: hatchling drops it from the wheel and writes
# an unusable `../../` member into the sdist. `make check` verifies the copy is
# byte-identical to the root LICENSE.
license-files = ["LICENSE"]
authors = [
    { name = "Judd Storrs", email = "jstorrs@gmail.com" },
]
keywords = ["fMRI", "MRI", "phantom", "quality assurance", "NIfTI", "netCDF"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# fmri-qa-core supplies the value objects this package reads and writes.
dependencies = [
    "fmri-qa-core==0.1.0",
    "nibabel>=5.3.2",
    # The artifact's container. It is worth a ~10 MB wheel carrying libhdf5 and
    # libnetcdf: this is the Unidata C library that MATLAB's `ncread`, R's
    # `ncdf4`, `ncdump` and xarray read through, so a file it writes is a file
    # those were tested against. Writing netCDF-4 by hand or with a pure-Python
    # encoder would claim compatibility with a format whose only reference
    # implementation we declined to link.
    # Pyodide reports sys_platform "emscripten" and micropip evaluates markers,
    # so a browser install of this package skips the native netCDF library and
    # only the artifact container is unavailable there.
    "netCDF4>=1.7; sys_platform != 'emscripten'",
    "numpy>=2.3.4",
]

[tool.uv.sources]
fmri-qa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmriqa_io"]

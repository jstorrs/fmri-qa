[project]
name = "fmri-qa-web"
version = "0.1.0"
description = "The Python half of the fmri-qa browser page: bytes in, names, report and record out"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
# A per-package copy of the root LICENSE; see fmri-qa-report's pyproject.
license-files = ["LICENSE"]
authors = [
    { name = "Judd Storrs", email = "jstorrs@gmail.com" },
]
keywords = ["fMRI", "MRI", "phantom", "quality assurance", "browser", "Pyodide"]
classifiers = [
    # Private: the page vendors this package's wheel. It is never published.
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# It adds no third-party dependency. It touches no file and starts no process,
# so it runs under Pyodide, where fmri-qa-io's netCDF4 and dcm2niix do not exist.
dependencies = [
    "fmri-qa-core==0.1.0",
    "fmri-qa-io==0.1.0",
    "fmri-qa-report==0.1.0",
]

[tool.uv.sources]
fmri-qa-core = { workspace = true }
fmri-qa-io = { workspace = true }
fmri-qa-report = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmriqa_web"]

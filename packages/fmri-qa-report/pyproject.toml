[project]
name = "fmri-qa-report"
version = "0.1.0"
description = "PDF reports and plots for fmri-qa phantom QA analysis artifacts"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["../../LICENSE"]
authors = [
    { name = "Judd Storrs", email = "jstorrs@gmail.com" },
]
keywords = ["fMRI", "MRI", "phantom", "quality assurance", "report"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# fmri-qa-core supplies the QAArtifact value objects and the .npz reader; this
# package consumes an artifact and never runs the pipeline itself, so nibabel
# and scikit-image are not needed here (they arrive only via core).
dependencies = [
    "fmri-qa-core==0.1.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "reportlab>=5.0.0",
    # formats/reportlab.py probes and patches svglib's private image converter.
    # Verify that adapter before widening this bound.
    "svglib>=2.0.2,<2.1",
]

[project.scripts]
fmri-qa-report = "fmriqc_report.cli:main"

[tool.uv.sources]
fmri-qa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmriqc_report"]

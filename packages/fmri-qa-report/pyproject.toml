[project]
name = "fmri-qa-report"
version = "0.1.0"
description = "Self-contained offline HTML reports for fmri-qa phantom QA analysis artifacts"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
# A per-package copy of the root LICENSE. A path outside the package
# (../../LICENSE) is not portable: hatchling drops it from the wheel and writes
# an unusable `../../` member into the sdist. `make check` verifies the copy is
# byte-identical to the root LICENSE.
license-files = ["LICENSE"]
authors = [
    { name = "Judd Storrs", email = "jstorrs@gmail.com" },
]
keywords = ["fMRI", "MRI", "phantom", "quality assurance", "report"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# fmri-qa-core supplies the QAArtifact value objects. This package takes an
# artifact in memory and returns a string: it reads and writes no file, and it
# never runs the pipeline, so nibabel, netCDF4 and scikit-image are not needed
# here.
dependencies = [
    "fmri-qa-core==0.1.0",
    # The Theme builds an axes.prop_cycle directly, so cycler is a direct
    # dependency even though matplotlib always brings it along.
    "cycler>=0.10",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
]

[tool.uv.sources]
fmri-qa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmriqa_report"]

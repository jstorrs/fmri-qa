[project]
name = "fmri-qa-launcher"
version = "0.1.0"
description = "Application shell that runs fmri-qa end to end: DICOM directory in, one report directory per series out"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
# A per-package copy of the root LICENSE. A path outside the package
# (../../LICENSE) is not portable: hatchling drops it from the wheel and writes
# an unusable `../../` member into the sdist. `make check` verifies the copy is
# byte-identical to the root LICENSE.
license-files = ["LICENSE"]
authors = [
    { name = "Judd Storrs", email = "jstorrs@gmail.com" },
]
keywords = ["fMRI", "MRI", "phantom", "quality assurance", "launcher"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The launcher only orchestrates fmri-qa-core (conversion and analysis),
# fmri-qa-io (files) and fmri-qa-report (rendering), and borrows two argument
# parsers from fmri-qa-cli. It adds no third-party dependency. Its desktop panel
# uses tkinter, from the standard library.
dependencies = [
    "fmri-qa-cli==0.1.0",
    "fmri-qa-core==0.1.0",
    "fmri-qa-io==0.1.0",
    "fmri-qa-report==0.1.0",
]

[project.scripts]
fmri-qa-run = "fmriqa_launcher.cli:main"

# A gui-script, not a second `[project.scripts]` entry. On Windows it runs
# under `pythonw` with no console, so `panel` never prints (`sys.stdout` and
# `sys.stderr` are `None` there). The console entry point above stays separate
# because `fmri-qa-run` needs a console for its stdout/stderr contract.
[project.gui-scripts]
fmri-qa-panel = "fmriqa_launcher.panel:main"

[tool.uv.sources]
fmri-qa-cli = { workspace = true }
fmri-qa-core = { workspace = true }
fmri-qa-io = { workspace = true }
fmri-qa-report = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmriqa_launcher"]

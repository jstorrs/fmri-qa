# Runs the standard loop earlier; see style/tooling.md.
# Install once with `uv run pre-commit install`.
#
# Every hook is local and goes through `uv run`, so a commit is checked by the
# ruff and mypy pinned in uv.lock. A remote hook pins its own ruff, which drifts
# from the locked one and lets the hook and `make check` disagree about
# formatting.
#
# `--force-exclude` makes ruff honor the root pyproject's `extend-exclude` even
# for paths pre-commit passes explicitly.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

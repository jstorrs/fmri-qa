# Runs the same gate as `make check` (see style/tooling.md) on every push and PR:
# ruff format --check, ruff lint, mypy, pyright, pytest -- against the locked env.
name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (e.g. a force-push mid-run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true

      # Provision the pinned interpreter (.python-version) so the lock resolves.
      - name: Install Python
        run: uv python install

      # --locked fails if uv.lock is out of date with pyproject.toml, so a stale
      # lockfile is caught here rather than drifting silently.
      - name: Sync the locked environment
        run: uv sync --all-extras --locked

      - name: Run the gate
        run: make check

      - name: Build wheel and source distribution
        run: uv build

      # Exercise the artifact users install, independently of the editable
      # environment used by the source-tree gate above.
      - name: Smoke-test the built wheel
        run: |
          wheels=(dist/*.whl)
          test -f "${wheels[0]}"
          uv venv --python 3.13 .venv-wheel-smoke
          uv pip install --python .venv-wheel-smoke/bin/python "${wheels[0]}"
          .venv-wheel-smoke/bin/fmri-qa --version
          .venv-wheel-smoke/bin/fmri-qa-hilo --help > /dev/null
          .venv-wheel-smoke/bin/python -c "from importlib.resources import files; assert files('fmriqc').joinpath('py.typed').is_file()"

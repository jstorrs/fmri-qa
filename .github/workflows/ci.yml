# Runs the same gate as `make check` (see style/tooling.md) on every push and PR:
# ruff format --check, ruff lint, mypy, pyright, pytest, and the documentation
# build -- against the locked env.
name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (e.g. a force-push mid-run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true

      # Provision the pinned interpreter (.python-version) so the lock resolves.
      - name: Install Python
        run: uv python install

      # --locked fails if uv.lock is out of date with pyproject.toml, so a stale
      # lockfile is caught here rather than drifting silently.
      - name: Sync the locked environment
        # The docs group comes too: `make check` ends by building the
        # documentation site, whose figures are rendered by running the pipeline.
        run: uv sync --all-packages --group docs --locked

      - name: Run the gate
        run: make check

      - name: Build every wheel and source distribution
        run: uv build --all-packages

      # Exercise the artifacts users install, independently of the editable
      # environment used by the source-tree gate above. The core wheel is
      # installed alone first: the calculation half must stand up without the
      # report half (and so without matplotlib).
      - name: Smoke-test the core wheel on its own
        run: |
          core=(dist/fmri_qa_core-*.whl)
          test -f "${core[0]}"
          uv venv --python 3.13 .venv-core-smoke
          uv pip install --python .venv-core-smoke/bin/python "${core[0]}"
          .venv-core-smoke/bin/python -c "from importlib.resources import files; assert files('fmriqa').joinpath('py.typed').is_file()"
          # The seam, checked against the installed artifact: no drawing stack.
          .venv-core-smoke/bin/python -c "import importlib.util as u; assert u.find_spec('matplotlib') is None"
          # Nor the artifact file's native library: the container is fmri-qa-io's.
          .venv-core-smoke/bin/python -c "import importlib.util as u; assert u.find_spec('netCDF4') is None, 'the core wheel pulled in netCDF4'"
          # Nor the DICOM converter: running dcm2niix is fmri-qa-io's.
          .venv-core-smoke/bin/python -c "import importlib.util as u; assert u.find_spec('dcm2niix') is None, 'the core wheel pulled in dcm2niix'"
          # Nor the NIfTI decoder: core reads no files, and decoding is fmri-qa-io's.
          .venv-core-smoke/bin/python -c "import importlib.util as u; assert u.find_spec('nibabel') is None, 'the core wheel pulled in nibabel'"
          # The MIT text has to reach whoever installs the wheel. hatchling puts
          # a declared license file under the dist-info `licenses/` directory.
          .venv-core-smoke/bin/python -c "from importlib.metadata import distribution; text = distribution('fmri-qa-core').read_text('licenses/LICENSE'); assert text and 'MIT License' in text, 'the core wheel ships no license text'"

      - name: Smoke-test the io wheel against the core wheel
        run: |
          core=(dist/fmri_qa_core-*.whl)
          io=(dist/fmri_qa_io-*.whl)
          test -f "${io[0]}"
          uv venv --python 3.13 .venv-io-smoke
          uv pip install --python .venv-io-smoke/bin/python "${core[0]}" "${io[0]}"
          .venv-io-smoke/bin/python -c "import fmriqa_io"
          .venv-io-smoke/bin/python -c "from importlib.resources import files; assert files('fmriqa_io').joinpath('py.typed').is_file()"
          .venv-io-smoke/bin/python -c "from importlib.metadata import distribution; text = distribution('fmri-qa-io').read_text('licenses/LICENSE'); assert text and 'MIT License' in text, 'the io wheel ships no license text'"

      - name: Smoke-test the cli wheel against the core, io and report wheels
        run: |
          core=(dist/fmri_qa_core-*.whl)
          io=(dist/fmri_qa_io-*.whl)
          cli=(dist/fmri_qa_cli-*.whl)
          report=(dist/fmri_qa_report-*.whl)
          test -f "${cli[0]}"
          uv venv --python 3.13 .venv-cli-smoke
          uv pip install --python .venv-cli-smoke/bin/python "${core[0]}" "${io[0]}" "${report[0]}" "${cli[0]}"
          .venv-cli-smoke/bin/fmri-qa --version
          .venv-cli-smoke/bin/fmri-qa-hilo --help > /dev/null
          .venv-cli-smoke/bin/fmri-qa-import --help > /dev/null
          .venv-cli-smoke/bin/fmri-qa-report --help > /dev/null
          .venv-cli-smoke/bin/python -m fmriqa_cli --version
          .venv-cli-smoke/bin/python -c "from importlib.resources import files; assert files('fmriqa_cli').joinpath('py.typed').is_file()"
          .venv-cli-smoke/bin/python -c "from importlib.metadata import distribution; text = distribution('fmri-qa-cli').read_text('licenses/LICENSE'); assert text and 'MIT License' in text, 'the cli wheel ships no license text'"
          .venv-cli-smoke/bin/python -c "import sys; import fmriqa_cli.report; assert not any(n == 'fmriqa.pipeline' or n.startswith('fmriqa.pipeline.') for n in sys.modules), 'the report command imported the pipeline'"
          # Core ships no commands: only the cli wheel owns the entry points.
          .venv-cli-smoke/bin/python -c "from importlib.metadata import distribution; assert not distribution('fmri-qa-core').entry_points, 'the core wheel ships console scripts'"

      - name: Smoke-test the report wheel against the core wheel
        run: |
          core=(dist/fmri_qa_core-*.whl)
          report=(dist/fmri_qa_report-*.whl)
          test -f "${report[0]}"
          uv venv --python 3.13 .venv-report-smoke
          uv pip install --python .venv-report-smoke/bin/python "${core[0]}" "${report[0]}"
          # The report is a library: only the cli wheel owns the entry points.
          .venv-report-smoke/bin/python -c "from importlib.metadata import distribution; assert not distribution('fmri-qa-report').entry_points, 'the report wheel ships console scripts'"
          .venv-report-smoke/bin/python -c "from importlib.resources import files; assert files('fmriqa_report').joinpath('py.typed').is_file()"
          .venv-report-smoke/bin/python -c "from importlib.resources import files; root = files('fmriqa_report.formats.html'); assert root.joinpath('templates/run.html').is_file() and root.joinpath('assets/report.css').is_file(), 'the report wheel ships no HTML resources'"
          .venv-report-smoke/bin/python -c "import sys; import fmriqa_report; assert 'matplotlib' not in sys.modules, 'importing the report package loaded matplotlib'"
          .venv-report-smoke/bin/python -c "import fmriqa_report.formats.html.run"
          # The seam, checked against the installed artifact: the report does no file IO.
          .venv-report-smoke/bin/python -c "import importlib.util as u; assert u.find_spec('fmriqa_io') is None, 'the report wheel pulled in fmri-qa-io'"
          .venv-report-smoke/bin/python -c "from importlib.metadata import distribution; text = distribution('fmri-qa-report').read_text('licenses/LICENSE'); assert text and 'MIT License' in text, 'the report wheel ships no license text'"
          .venv-report-smoke/bin/python -c "import tarfile; archive = next(__import__('pathlib').Path('dist').glob('fmri_qa_report-*.tar.gz')); names = tarfile.open(archive).getnames(); assert any(name.endswith('src/fmriqa_report/formats/html/templates/run.html') for name in names) and any(name.endswith('src/fmriqa_report/formats/html/assets/report.css') for name in names), 'the report sdist ships no HTML resources'"

      - name: Smoke-test the launcher wheel against the other wheels
        run: |
          core=(dist/fmri_qa_core-*.whl)
          io=(dist/fmri_qa_io-*.whl)
          cli=(dist/fmri_qa_cli-*.whl)
          report=(dist/fmri_qa_report-*.whl)
          launcher=(dist/fmri_qa_launcher-*.whl)
          test -f "${launcher[0]}"
          uv venv --python 3.13 .venv-launcher-smoke
          uv pip install --python .venv-launcher-smoke/bin/python "${core[0]}" "${io[0]}" "${cli[0]}" "${report[0]}" "${launcher[0]}"
          .venv-launcher-smoke/bin/fmri-qa-run --version
          .venv-launcher-smoke/bin/fmri-qa-run -h > /dev/null
          .venv-launcher-smoke/bin/python -c "from importlib.resources import files; assert files('fmriqa_launcher').joinpath('py.typed').is_file()"
          .venv-launcher-smoke/bin/python -c "from importlib.metadata import distribution; text = distribution('fmri-qa-launcher').read_text('licenses/LICENSE'); assert text and 'MIT License' in text, 'the launcher wheel ships no license text'"

      - name: Smoke-test the web wheel on Python 3.14 against the core, io and report wheels
        run: |
          core=(dist/fmri_qa_core-*.whl)
          io=(dist/fmri_qa_io-*.whl)
          report=(dist/fmri_qa_report-*.whl)
          web=(dist/fmri_qa_web-*.whl)
          test -f "${web[0]}"
          # Python 3.14, the interpreter Pyodide ships, not the 3.13 the other wheels run on.
          uv python install 3.14
          uv venv --python 3.14 .venv-web-smoke
          uv pip install --python .venv-web-smoke/bin/python "${core[0]}" "${io[0]}" "${report[0]}" "${web[0]}"
          .venv-web-smoke/bin/python -c "from importlib.resources import files; assert files('fmriqa_web').joinpath('py.typed').is_file()"
          .venv-web-smoke/bin/python -c "import fmriqa_web, fmriqa_web.bridge, fmriqa_web.document, fmriqa_web.exceptions, fmriqa_web.naming, fmriqa_web.series"
          # The browser seam, checked against the installed artifact: no commands, no launcher, no artifact file.
          .venv-web-smoke/bin/python -c "import importlib.util as u, sys; import fmriqa_web; assert fmriqa_web.contract()['json_schema_version'], 'no contract'; assert u.find_spec('fmriqa_cli') is None and u.find_spec('fmriqa_launcher') is None, 'the web wheel pulled in a command line or the launcher'; assert 'netCDF4' not in sys.modules, 'importing fmriqa_web loaded netCDF4'"
          .venv-web-smoke/bin/python -c "from importlib.metadata import distribution; text = distribution('fmri-qa-web').read_text('licenses/LICENSE'); assert text and 'MIT License' in text, 'the web wheel ships no license text'"

[project]
name = "fmri-qa"
version = "0.1.0"
description = "Phantom fMRI quality-assurance metrics (SNR, SFNR, RDC, ghost)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.7",
    "nibabel>=5.3.2",
    "numpy>=2.3.4",
    "reportlab>=5.0.0",
    "scikit-image>=0.25.2",
    "scipy>=1.16.2",
    "svglib>=2.0.2",
]

[project.optional-dependencies]
notebooks = [
    "dcm2bids>=3.2.0",
    "dcm2niix>=1.0.20250506",
    "ipympl>=0.9.8",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.10",
    "nilearn>=0.12.1",
    "niwidgets>=0.2.1",
    "pydicom>=3.0.1",
    "scikit-fem>=12.0.2",
]

[project.scripts]
fmri-qa = "fmriqc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmriqc"]

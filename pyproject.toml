# uv workspace root for fmri-qa. The project ships as three distributions:
#
#   packages/fmri-qa-core     the calculation half -- metrics, pipeline, and the
#                             QAArtifact it publishes (`fmri-qa`, `fmri-qa-hilo`)
#   packages/fmri-qa-report   the presentation half -- a self-contained HTML report
#                             built from an artifact (`fmri-qa-report`)
#   packages/fmri-qa-launcher the application shell -- a one-step DICOM-directory-in,
#                             report-directory-out pipeline over the two above
#
# This root is virtual: it builds nothing of its own and only holds the shared
# development environment and the tool configuration all members are checked
# against. See style/architecture.md and notes/analysis_report_split.md.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.18",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    # Only the artifact tests use it: xarray is the one-line path a notebook
    # takes to a `.qa.nc`, and the claim that it opens one cleanly is worth
    # checking in the gate. It is dev tooling and never a distribution
    # dependency — nothing either package ships imports it.
    "xarray>=2024.1",
]
# The exploratory notebooks (DICOM conversion, BIDS, interactive viewers) need a
# far heavier stack than either distribution ships. It is development tooling,
# so it belongs to the workspace root as a group and not to a published extra —
# whoever installs fmri-qa-core should never be offered JupyterLab. It is not in
# the default sync; take it with `make sync-notebooks`.
notebooks = [
    "dcm2bids>=3.2.0",
    "dcm2niix>=1.0.20250506",
    "ipympl>=0.9.8",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.10",
    "nilearn>=0.12.1",
    "niwidgets>=0.2.1",
    "pydicom>=3.0.1",
    "scikit-fem>=12.0.2",
]
# The analysis documentation (packages/fmri-qa-core/docs) is built with Sphinx,
# and its figures are rendered at build time by running the real pipeline over
# the synthetic phantom — so the stack is Sphinx plus matplotlib, and nothing in
# the gate needs it either. Same reasoning as `notebooks`: it is development
# tooling, so it is a workspace group rather than a published extra, and it is
# out of the default sync. Take it with `make sync-docs`.
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024",
    "matplotlib>=3.9",
]
# PyInstaller, for the single-file `fmri-qa-run` (`make bundle`; see
# packages/fmri-qa-launcher/bundle/fmri-qa-run.spec). A workspace group for the
# reason `notebooks` and `docs` are: it builds a distribution and is never part
# of one. It is also the only group the bundle is built with -- `make bundle`
# resolves an isolated environment from the lock with `dev` left out, so the
# executable carries what the three packages declare and nothing this shared
# environment happens to have installed.
bundle = [
    "pyinstaller>=6.11",
]

# Sync the dev group by default; notebooks, docs and bundle stay opt-in.
[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = [
    "packages/fmri-qa-core/src",
    "packages/fmri-qa-report/src",
    "packages/fmri-qa-launcher/src",
]
# Reference notebooks are exploratory scratch, not maintained code — skip them.
extend-exclude = ["notebooks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# See style/tooling.md for the rationale behind each group. TC (type-only
# imports under TYPE_CHECKING) and D (docstrings) are deliberately left out for
# now — the ruleset is a living part of the style, tightened as needs recur.
select = [
    "E", "W", "F",   # pycodestyle + Pyflakes
    "I",             # import sorting (isort)
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM", "RET", "PIE", "FURB", "C4",  # simplifications
    "S",             # flake8-bandit security
    "BLE",           # blind-except (justified batch catches carry a scoped noqa)
    "PERF",          # performance anti-patterns
    "PLE", "PLC", "PLW",  # pylint errors / conventions / warnings
    "PTH",           # prefer pathlib over os.path
    "G",             # logging-format correctness
    "A",             # shadowing builtins
    "T20",           # flake8-print (keeps print out of libraries)
    "RUF",           # ruff-specific rules
]
ignore = [
    "PLC0415",  # allow function-local imports
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the assertion, magic values and unused fixture args are fine.
"**/tests/**" = ["S101", "PLR2004", "ARG"]
# Output belongs to the binary (see style/logging.md).
"**/cli.py" = ["T201"]
"**/cli/*.py" = ["T201"]
"**/__main__.py" = ["T201"]
# The report renders human-facing text with intentional typography (× ° —), and
# its tests assert on that text.
"packages/fmri-qa-report/**" = ["RUF001"]
# Stubs mirror external library signatures verbatim, including names we would
# not choose: scipy's `input` parameter (A002) and the dcm2niix wrapper's
# module-level `bin` (A001). Renaming either would make the stub describe a
# module that does not exist.
"stubs/**" = ["A001", "A002"]

[tool.ruff.lint.isort]
known-first-party = ["fmriqc", "fmriqc_report", "fmriqc_launcher"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
files = [
    "packages/fmri-qa-core/src",
    "packages/fmri-qa-report/src",
    "packages/fmri-qa-launcher/src",
    "scripts",
]
# Local partial stubs (see stubs/) fix the return types nibabel and scipy ship
# imprecisely; both type checkers read them first (pyright via tool.pyright.stubPath).
mypy_path = "stubs"

# Scientific stack whose shipped types we treat as untyped. `follow_imports =
# skip` renders these installed-but-untyped packages as `Any` instead of
# analyzing their internals, so calling their functions is not flagged as an
# untyped call. nibabel and scipy are handled by the local stubs instead.
[[tool.mypy.overrides]]
module = [
    "skimage.*",
    "matplotlib.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pyright]
include = [
    "packages/fmri-qa-core/src",
    "packages/fmri-qa-report/src",
    "packages/fmri-qa-launcher/src",
    "scripts",
]
# scripts/ is not a package: its tests import a script by its bare module name,
# as pytest's `pythonpath` lets them at run time.
extraPaths = ["scripts"]
stubPath = "stubs"
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = [
    "packages/fmri-qa-core/tests",
    "packages/fmri-qa-report/tests",
    "packages/fmri-qa-launcher/tests",
    "scripts/tests",
]
# The repository's own scripts are not a package, so their tests import one by
# its bare module name from here.
pythonpath = ["scripts"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Coverage is opt-in (the `check` gate passes --cov) so a bare `pytest` on one
# file stays fast and doesn't trip the package-wide floor. `importlib` import
# mode lets both packages name a test file for what it tests (each has a
# `test_cli.py`) without the rootdir-relative module names colliding.
addopts = "-v --tb=short --import-mode=importlib"

[tool.coverage.run]
source = [
    "packages/fmri-qa-core/src/fmriqc",
    "packages/fmri-qa-report/src/fmriqc_report",
    "packages/fmri-qa-launcher/src/fmriqc_launcher",
]
branch = true
# `panel.py` is Tk widget construction, layout, and the `after` pump: headless
# CI has no display to build a `tk.Tk` root against at all. What decisions it
# still owns -- destroy-on-close being unconditional, skipping auto-open
# while closing, not resuming the `after` chain after a callback exception --
# are lifecycle wiring that only exists once real widgets do; everything that
# can be decided as a pure function of a value (where the bar sits, what a
# finished run means, the stopping message, the exit code, the bar's `max(...,
# 1)` guard) lives in `worker.py`/`panel_state.py`/`request.parse_form`
# instead, which *are* covered. `tests/test_panel.py` exercises `panel.py`'s
# lifecycle end to end (a real `Panel` on a real `tk.Tk` root, a fake
# background run, no real pipeline) wherever a display exists -- gated on
# whether `tk.Tk()` succeeds, not on `$DISPLAY`, so it runs on Windows/macOS
# too; run it explicitly under Xvfb where CI has none:
# `xvfb-run -a uv run pytest packages/fmri-qa-launcher/tests/test_panel.py`.
# One greppable exemption here, rather than scattered `# pragma: no cover`
# comments (this repo uses none), also keeps the pressure on `panel.py` to
# stay decision-free.
omit = ["packages/fmri-qa-launcher/src/fmriqc_launcher/panel.py"]

[tool.coverage.report]
# The numeric core carries the metrics; the untested lines that remain are
# defensive branches and the `__main__`/`if __name__` shims.
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

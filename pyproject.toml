# uv workspace root for fmri-qa. The project ships as five distributions:
#
#   packages/fmri-qa-core     the calculation half: metrics, pipeline, and the
#                             QAArtifact it publishes
#   packages/fmri-qa-io       file formats and filesystem IO: scans, the `.qa.nc`
#                             artifact file, DICOM import (keeps core pure)
#   packages/fmri-qa-cli      the command-line shell over core and io (`fmri-qa`,
#                             `fmri-qa-hilo`, `fmri-qa-import`)
#   packages/fmri-qa-report   the presentation half: a self-contained HTML report
#                             built from an artifact (`fmri-qa-report`)
#   packages/fmri-qa-launcher the application shell: a one-step DICOM-directory-in,
#                             report-directory-out pipeline over the packages above
#
# This root is virtual. It builds nothing and only holds the shared development
# environment and the tool configuration all members are checked against. See
# style/architecture.md and notes/analysis_report_split.md.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.18",
    # Only `tests/test_packaging.py` uses it, to evaluate dependency markers.
    "packaging>=25",
    # Only the git hook uses it (`uv run pre-commit install`).
    "pre-commit>=4",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    # Only the artifact tests use it. xarray is the one-line path from a
    # notebook to a `.qa.nc`, so the gate checks that it opens one cleanly.
    # Nothing either package ships imports it.
    "xarray>=2024.1",
]
# The exploratory notebooks (DICOM conversion, BIDS, interactive viewers) need a
# far heavier stack than either distribution ships. It is a workspace group, not
# a published extra, so whoever installs fmri-qa-core is never offered
# JupyterLab. It is not in the default sync; take it with `make sync-notebooks`.
notebooks = [
    "dcm2bids>=3.2.0",
    "dcm2niix>=1.0.20250506",
    "ipympl>=0.9.8",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.10",
    "nilearn>=0.12.1",
    "niwidgets>=0.2.1",
    "pydicom>=3.0.1",
    "scikit-fem>=12.0.2",
]
# The documentation (docs/) is built with Sphinx. Its figures come from running
# the real pipeline over the synthetic phantom at build time, so the stack is
# Sphinx plus matplotlib, with numpydoc for the API reference. Like `notebooks`,
# it is a workspace group, not a published extra, and is out of the default
# sync. Take it with `make sync-docs`. `make docs` needs it, and `make check` runs
# `make docs`.
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024",
    "matplotlib>=3.9",
    "numpydoc>=1.10",
]
# PyInstaller, for the single-file `fmri-qa-run` (`make bundle`; see
# packages/fmri-qa-launcher/bundle/fmri-qa-run.spec). Like `notebooks` and
# `docs`, it builds a distribution and is never part of one. `make bundle`
# resolves an isolated environment from the lock with `dev` left out, so the
# executable carries only what the five packages declare.
bundle = [
    "pyinstaller>=6.11",
]

# Sync the dev group by default; notebooks, docs and bundle stay opt-in.
[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = [
    "packages/fmri-qa-core/src",
    "packages/fmri-qa-io/src",
    "packages/fmri-qa-cli/src",
    "packages/fmri-qa-report/src",
    "packages/fmri-qa-launcher/src",
]
# Reference notebooks and the Pyodide spike are exploratory scratch, not maintained
# code — skip them.
extend-exclude = ["notebooks", "notes/pyodide-spike"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# See style/tooling.md for the rationale behind each group. TC (type-only
# imports under TYPE_CHECKING) is left out for now. The ruleset is tightened as
# needs recur.
select = [
    "E", "W", "F",   # pycodestyle + Pyflakes
    "I",             # import sorting (isort)
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM", "RET", "PIE", "FURB", "C4",  # simplifications
    "S",             # flake8-bandit security
    "BLE",           # blind-except (justified batch catches carry a scoped noqa)
    "PERF",          # performance anti-patterns
    "PLE", "PLC", "PLW",  # pylint errors / conventions / warnings
    "PTH",           # prefer pathlib over os.path
    "G",             # logging-format correctness
    "A",             # shadowing builtins
    "T20",           # flake8-print (keeps print out of libraries)
    "RUF",           # ruff-specific rules
    "D",             # pydocstyle (numpy convention, see below)
]
ignore = [
    "PLC0415",  # allow function-local imports
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the assertion, magic values and unused fixture args are fine,
# and test names and bodies document themselves.
"**/tests/**" = ["S101", "PLR2004", "ARG", "D"]
# Output belongs to the binary (see style/logging.md).
"**/cli.py" = ["T201"]
"packages/fmri-qa-cli/src/**" = ["T201"]
# `__main__.py` is a bare entry-point shim with nothing to document.
"**/__main__.py" = ["T201", "D"]
# The report renders human-facing text with intentional typography (× ° —), and
# its tests assert on that text.
"packages/fmri-qa-report/**" = ["RUF001"]
# Stubs mirror external library signatures verbatim, including names we would
# not choose: scipy's `input` parameter (A002) and the dcm2niix wrapper's
# module-level `bin` (A001). Renaming either would describe a module that does
# not exist. Their docstrings say why the stub exists, not what each signature
# does.
"stubs/**" = ["A001", "A002", "D"]

[tool.ruff.lint.isort]
known-first-party = ["fmriqa", "fmriqa_io", "fmriqa_cli", "fmriqa_report", "fmriqa_launcher"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
files = [
    "packages/fmri-qa-core/src",
    "packages/fmri-qa-io/src",
    "packages/fmri-qa-cli/src",
    "packages/fmri-qa-report/src",
    "packages/fmri-qa-launcher/src",
    "scripts",
]
# Local partial stubs (see stubs/) fix the return types nibabel and scipy ship
# imprecisely; both type checkers read them first (pyright via tool.pyright.stubPath).
mypy_path = "stubs"

# Scientific stack whose shipped types we treat as untyped. `follow_imports =
# skip` renders these as `Any` instead of analyzing their internals, so calls
# to them are not flagged as untyped. nibabel and scipy use the local stubs.
[[tool.mypy.overrides]]
module = [
    "skimage.*",
    "matplotlib.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pyright]
include = [
    "packages/fmri-qa-core/src",
    "packages/fmri-qa-io/src",
    "packages/fmri-qa-cli/src",
    "packages/fmri-qa-report/src",
    "packages/fmri-qa-launcher/src",
    "scripts",
]
# scripts/ is not a package. Its tests import a script by bare module name,
# which pytest's `pythonpath` allows at run time.
extraPaths = ["scripts"]
stubPath = "stubs"
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = [
    "packages/fmri-qa-core/tests",
    "packages/fmri-qa-io/tests",
    "packages/fmri-qa-cli/tests",
    "packages/fmri-qa-report/tests",
    "packages/fmri-qa-launcher/tests",
    "scripts/tests",
]
# The repository's scripts are not a package, so their tests import one by its
# bare module name from here.
pythonpath = ["scripts"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Coverage is opt-in (the `check` gate passes --cov), so a bare `pytest` on one
# file stays fast and skips the package-wide floor. `importlib` import mode
# lets several packages each have a `test_cli.py` without a module name collision.
addopts = "-v --tb=short --import-mode=importlib"

[tool.coverage.run]
source = [
    "packages/fmri-qa-core/src/fmriqa",
    "packages/fmri-qa-io/src/fmriqa_io",
    "packages/fmri-qa-cli/src/fmriqa_cli",
    "packages/fmri-qa-report/src/fmriqa_report",
    "packages/fmri-qa-launcher/src/fmriqa_launcher",
]
branch = true
# `panel.py` is Tk widget construction, layout and the `after` pump, and
# headless CI has no display to build a `tk.Tk` root. Its lifecycle decisions
# (destroy-on-close is unconditional, no auto-open while closing, no resuming
# the `after` chain after a callback exception) need real widgets. Anything
# that is a pure function of a value (where the bar sits, what a finished run
# means, the stopping message, the exit code, the bar's `max(..., 1)` guard)
# lives in `worker.py`, `panel_state.py` and `request.parse_form`, which are
# covered. `tests/test_panel.py` runs `panel.py` end to end (a real `Panel` on a
# real `tk.Tk` root, a fake background run) wherever `tk.Tk()` succeeds, not on
# `$DISPLAY`, so it also runs on Windows and macOS. Where CI has no display, run it under Xvfb:
# `xvfb-run -a uv run pytest packages/fmri-qa-launcher/tests/test_panel.py`.
# One greppable exemption beats scattered `# pragma: no cover` comments (this
# repo uses none) and keeps pressure on `panel.py` to stay decision-free.
omit = ["packages/fmri-qa-launcher/src/fmriqa_launcher/panel.py"]

[tool.coverage.report]
# The numeric core carries the metrics. The untested lines that remain are
# defensive branches and the `__main__`/`if __name__` shims.
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

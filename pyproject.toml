readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dcm2bids>=3.2.0",
    "dcm2niix>=1.0.20250506",
    "ipympl>=0.9.8",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.10",
    "matplotlib>=3.10.7",
    "nibabel>=5.3.2",
    "nilearn>=0.12.1",
    "niwidgets>=0.2.1",
    "numpy>=2.3.4",
    "pydicom>=3.0.1",
    "reportlab>=5.0.0",
    "scikit-fem>=12.0.2",
    "scikit-image>=0.25.2",
]

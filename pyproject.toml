[project]
name = "fmri-qa"
version = "0.1.0"
description = "Phantom fMRI quality-assurance metrics (SNR, SFNR, RDC, ghost)"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Judd Storrs", email = "jstorrs@gmail.com" },
]
keywords = ["fMRI", "MRI", "phantom", "quality assurance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.10.7",
    "nibabel>=5.3.2",
    "numpy>=2.3.4",
    "reportlab>=5.0.0",
    "scikit-image>=0.25.2",
    "scipy>=1.16.2",
    # reportlab.py probes and patches svglib's private image converter. Verify
    # that adapter before widening this bound.
    "svglib>=2.0.2,<2.1",
]

[project.optional-dependencies]
notebooks = [
    "dcm2bids>=3.2.0",
    "dcm2niix>=1.0.20250506",
    "ipympl>=0.9.8",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.10",
    "nilearn>=0.12.1",
    "niwidgets>=0.2.1",
    "pydicom>=3.0.1",
    "scikit-fem>=12.0.2",
]

[project.scripts]
fmri-qa = "fmriqc.cli:main"
fmri-qa-hilo = "fmriqc.cli:hilo_main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.18",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmriqc"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]
# Reference notebooks and standalone repro scripts are exploratory scratch, not
# maintained code — skip them.
extend-exclude = ["notebooks", "examples"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# See style/tooling.md for the rationale behind each group. TC (type-only
# imports under TYPE_CHECKING) and D (docstrings) are deliberately left out for
# now — the ruleset is a living part of the style, tightened as needs recur.
select = [
    "E", "W", "F",   # pycodestyle + Pyflakes
    "I",             # import sorting (isort)
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM", "RET", "PIE", "FURB", "C4",  # simplifications
    "S",             # flake8-bandit security
    "BLE",           # blind-except (justified batch catches carry a scoped noqa)
    "PERF",          # performance anti-patterns
    "PLE", "PLC", "PLW",  # pylint errors / conventions / warnings
    "PTH",           # prefer pathlib over os.path
    "G",             # logging-format correctness
    "A",             # shadowing builtins
    "T20",           # flake8-print (keeps print out of libraries)
    "RUF",           # ruff-specific rules
]
ignore = [
    "PLC0415",  # allow function-local imports (the CLI lazily imports report)
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the assertion, magic values and unused fixture args are fine.
"**/tests/**" = ["S101", "PLR2004", "ARG"]
# Output belongs to the binary (see style/logging.md).
"**/cli.py" = ["T201"]
"**/__main__.py" = ["T201"]
# The report renders human-facing text with intentional typography (× ° —).
"src/fmriqc/report/**" = ["RUF001"]
# Stubs mirror external library signatures verbatim (e.g. scipy's `input` param).
"stubs/**" = ["A002"]

[tool.ruff.lint.isort]
known-first-party = ["fmriqc"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
files = ["src"]
# Local partial stubs (see stubs/) fix the return types nibabel and scipy ship
# imprecisely; both type checkers read them first (pyright via tool.pyright.stubPath).
mypy_path = "stubs"

# Scientific stack whose shipped types we treat as untyped. `follow_imports =
# skip` renders these installed-but-untyped packages as `Any` instead of
# analyzing their internals, so calling their functions is not flagged as an
# untyped call. nibabel and scipy are handled by the local stubs instead.
[[tool.mypy.overrides]]
module = [
    "skimage.*",
    "svglib.*",
    "matplotlib.*",
    "reportlab.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pyright]
include = ["src"]
stubPath = "stubs"
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Coverage is opt-in (the `check` gate passes --cov) so a bare `pytest` on one
# file stays fast and doesn't trip the package-wide floor.
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/fmriqc"]
branch = true

[tool.coverage.report]
# The numeric core carries the metrics; the untested lines that remain are
# defensive branches and the `__main__`/`if __name__` shims.
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
